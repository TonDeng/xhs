<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>下载完整报告 · 每天一个测试</title>
<meta name="description" content="下载七宗罪 × 七美德人格测试完整深度报告。">
<style>
  :root{
    --bg:#0e0b12;
    --bg2:#16121f;
    --card:#1d1728;
    --gold:#c9a961;
    --gold2:#e8cf9a;
    --cream:#f2e9d8;
    --muted:#a89a82;
    --line:rgba(201,169,97,.25);
    --radius:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #241b33 0%, transparent 60%),
      radial-gradient(900px 500px at 90% 110%, #1a1226 0%, transparent 55%),
      var(--bg);
    color:var(--cream);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.6;
    min-height:100vh;
  }
  .wrap{max-width:520px;margin:0 auto;padding:30px 22px 60px}
  .head{text-align:center;margin-top:16px}
  .badge{width:96px;height:96px;margin:0 auto;border-radius:50%;border:1px solid var(--gold);
    display:flex;align-items:center;justify-content:center;font-size:40px;
    background:radial-gradient(circle at 35% 30%, #2b2138, #17121f);box-shadow:0 0 36px rgba(201,169,97,.22)}
  .kicker{font-size:12px;letter-spacing:4px;color:var(--gold);margin-top:18px}
  .title{font-size:26px;font-weight:700;margin-top:8px;letter-spacing:2px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-top:22px}
  .price-box{text-align:center;padding:8px 0 2px}
  .price-label{font-size:14px;color:var(--muted)}
  .price{font-size:44px;font-weight:800;color:var(--gold);margin-top:4px}
  .price small{font-size:16px;font-weight:400;color:var(--muted)}
  .qr-box{margin:18px auto 6px;width:210px;height:210px;background:#fff;border-radius:14px;padding:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .qr-box img{width:100%;height:100%;object-fit:contain;border-radius:6px}
  .steps{margin-top:16px;font-size:14px;color:var(--cream);line-height:2.1}
  .steps b{color:var(--gold2)}
  .note{font-size:12px;color:var(--muted);text-align:center;margin-top:16px}
  .back{margin-top:24px;display:block;width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;
    background:transparent;color:var(--gold);font-size:15px;cursor:pointer;font-family:inherit;text-align:center;text-decoration:none}
  .back:hover{border-color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="badge">📄</div>
    <div class="kicker">PREMIUM REPORT</div>
    <div class="title">下载完整深度报告</div>
  </div>

  <div class="panel">
    <div class="price-box">
      <div class="price-label">完整深度报告 · 一份</div>
      <div class="price">¥8.88 <small>/ 份</small></div>
    </div>
    <div class="qr-box"><img id="payQrImg" src="notes/img/skm-square.png" alt="微信收款码"></div>
    <div class="steps">
      <b>1.</b> 长按识别上方收款码，支付 <b>¥8.88</b><br>
      <b>2.</b> 将支付完成截图发送至公众号「<span id="payGzhName">每天一个测试</span>」<br>
      <b>3.</b> 公众号自动发送你的专属深度报告 📄
    </div>
  </div>

  <div class="note">报告包含：万字解读 · 行为模式剖析 · 专属修炼路线<br>测试结果仅供自我探索与娱乐参考</div>

  <a class="back" href="index.html">← 返回测试结果</a>
</div>

<script>
/* 支持 URL 参数覆盖公众号名：?gzh=xxx */
const params = new URLSearchParams(location.search);
const gzhName = params.get('gzh') || '每天一个测试';
document.getElementById('payGzhName').textContent = gzhName;
</script>
</body>
</html>
