<style>
  :root{

    --card:#1d1728;

    --cream:#f2e9d8;
    --muted:#a89a82;
    --line:rgba(201,169,97,.25);
    --radius:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    background:

    display:flex;align-items:center;justify-content:center;font-size:40px;
    background:radial-gradient(circle at 35% 30%, #2b2138, #17121f);box-shadow:0 0 36px rgba(201,169,97,.22)}
  .kicker{font-size:12px;letter-spacing:4px;color:var(--gold);margin-top:18px}
  .title{font-size:26px;font-weight:700;margin-top:8px;letter-spacing:2px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-top:22px}

  .price{font-size:44px;font-weight:800;color:var(--gold);margin-top:4px}
  .price small{font-size:16px;font-weight:400;color:var(--muted)}
  .qr-box{margin:18px auto 6px;width:320px;height:320px;max-width:100%;background:#fff;border-radius:16px;padding:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.25)}
  .qr-box img{width:100%;height:100%;object-fit:contain;border-radius:8px}
  .steps{margin-top:16px;font-size:14px;color:var(--cream);line-height:2.1}
  .steps b{color:var(--gold2)}
  .note{font-size:12px;color:var(--muted);text-align:center;margin-top:16px}
  .back{margin-top:24px;display:block;width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;
    background:transparent;color:var(--gold);font-size:15px;cursor:pointer;font-family:inherit;text-align:center;text-decoration:none}
  .back:hover{border-color:var(--gold)}
</style>
